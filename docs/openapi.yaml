        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CatalogId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Archivo original de hasta 5 MiB; se valida MIME real y decodificación, no solo el nombre.
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Producto con image.url pública y nueva image.version; no-store y X-Request-Id.
