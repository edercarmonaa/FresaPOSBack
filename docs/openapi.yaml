        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Laravel Sanctum implementado en 1.3b. Token opaco, sin JWT; SHA-256 en SQL,
        con expiración y revocación. Nunca en URLs. Las cookies Web no autentican esta API.
  parameters:
    CatalogId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CatalogUlid'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Identificador opcional del cliente. Un valor inválido se descarta y se
        sustituye por un ULID nativo. No autentica ni proporciona idempotencia.
      schema:
        $ref: '#/components/schemas/RequestId'
  headers:
    RequestId:
      description: Siempre presente en respuestas de API; coincide con meta.request_id.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    RetryAfter:
      description: Segundos hasta un nuevo intento; se conserva en 429 y si el 503 lo proporciona.
      schema:
        type: string
    Allow:
      description: Métodos HTTP admitidos por la ruta.
      schema:
        type: string
  schemas:
    SaleReceipt:
      type: object
      additionalProperties: false
      required:
      - sale_id
      - folio
      - closed_at
      - local_closed_at
      - timezone
      - sale_type
      - items
      - subtotal
      - discount_amount
      - discount
      - total
      - payments
      - note
      - establishment
      - employee
      - correction
      - revision
      properties:
        sale_id:
          $ref: '#/components/schemas/CatalogUlid'
        folio:
          type: string
          pattern: ^[0-9]{12}$
        closed_at:
          type: string
          format: date-time
        local_closed_at:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        timezone:
          type: string
        sale_type:
          enum:
          - counter
          - table
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - quantity
            - unit_price
            - line_total
            - note
            properties:
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 100
              unit_price:
                $ref: '#/components/schemas/SalesMoney'
              line_total:
                $ref: '#/components/schemas/SalesMoney'
              note:
                type:
                - string
                - 'null'
        subtotal:
          $ref: '#/components/schemas/SalesMoney'
        discount_amount:
          $ref: '#/components/schemas/SalesMoney'
        discount:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - type
          - value
          properties:
            type:
              enum:
              - percent
              - fixed
            value:
              oneOf:
              - type: integer
                minimum: 1
                maximum: 100
              - $ref: '#/components/schemas/SalesMoney'
        total:
          $ref: '#/components/schemas/SalesMoney'
        payments:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - method_code
            - method_name
            - applied_amount
            - received_cash
            - change_cash
            properties:
              method_code:
                enum:
                - cash
                - card
                - transfer
                - other
              method_name:
                type: string
              applied_amount:
                $ref: '#/components/schemas/SalesMoney'
              received_cash:
                type:
                - string
                - 'null'
                pattern: ^(?:0|[1-9][0-9]{0,14})\.[0-9]{4}$
              change_cash:
                type:
                - string
                - 'null'
                pattern: ^(?:0|[1-9][0-9]{0,14})\.[0-9]{4}$
        note:
          type:
          - string
          - 'null'
        establishment:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            name:
              type: string
            branch:
              type: string
            address:
              type: string
            phone:
              type: string
            fiscal_id:
              type: string
            footer:
              type: string
        employee:
          type:
          - string
          - 'null'
        correction:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - id
          - confirmed_at
          properties:
            id:
              $ref: '#/components/schemas/CatalogUlid'
            confirmed_at:
              type: string
              format: date-time
        revision:
          $ref: '#/components/schemas/SalesRevision'
    SaleReceiptResponse:
      type: object
      additionalProperties: false
      required:
      - success
      - code
      - message
      - data
      - meta
      properties:
        success:
          const: true
        code:
          const: OPERATION_SUCCESS
        message:
          type: string
        data:
          $ref: '#/components/schemas/SaleReceipt'
        meta:
          type: object
          required:
          - request_id
          properties:
            request_id:
              $ref: '#/components/schemas/RequestId'
    SaleCorrection:
      type: object
      additionalProperties: false
      required:
      - id
      - sale_id
      - cash_session_id
      - folio
      - status
      - reopened_by
      - reopened_at
      - observation
      - confirmed_by
      - confirmed_at
      - revision
      - original
      - proposed
      - sale
      - changes
      - financial
      properties:
        id:
          $ref: '#/components/schemas/CatalogUlid'
        sale_id:
          $ref: '#/components/schemas/CatalogUlid'
        cash_session_id:
          $ref: '#/components/schemas/CatalogUlid'
        folio:
          type: string
          pattern: ^[0-9]{12}$
        status:
          enum:
          - active
          - confirmed
          - unchanged
          - discarded
        reopened_by:
          $ref: '#/components/schemas/CatalogUlid'
        reopened_at:
          type: string
          format: date-time
        observation:
          type:
          - string
          - 'null'
          maxLength: 150
        confirmed_by:
          type:
          - string
          - 'null'
        confirmed_at:
          type:
          - string
          - 'null'
          format: date-time
        revision:
          $ref: '#/components/schemas/SalesRevision'
        original:
          $ref: '#/components/schemas/SalesDetail'
        proposed:
          $ref: '#/components/schemas/SalesDetail'
        sale:
          $ref: '#/components/schemas/SalesDetail'
        changes:
          type: array
          uniqueItems: true
          items:
            enum:
            - items
            - note
            - discount
        financial:
          type: object
          additionalProperties: false
          required:
          - original_total
          - proposed_total
          - difference
          - additional_paid
          - requires_refund
          - payment_reclassification_supported
          properties:
            original_total:
              $ref: '#/components/schemas/SalesMoney'
            proposed_total:
              $ref: '#/components/schemas/SalesMoney'
            difference:
              type: string
              pattern: ^-?(?:0|[1-9][0-9]{0,14})\.[0-9]{4}$
            additional_paid:
              $ref: '#/components/schemas/SalesMoney'
            requires_refund:
              type: boolean
            payment_reclassification_supported:
              const: false
    SaleCorrectionEdit:
