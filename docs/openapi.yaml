openapi: 3.1.0
info:
  title: FresaPOSBack API
  version: 1.0.0
  description: >-
    REST v1, autenticación y sesiones de 1.3b/1.3c, catálogo administrativo e imágenes de 1.4c. Ping y login son públicos.
    Sales 1.5d.3 incorpora checkout transaccional, pagos mixtos y folios diarios con Cash real e idempotencia durable. La etapa 1.6a habilita motivos autorizados, retiro y cancelación no financiera; aprobación de dispositivos pendiente. Imágenes administradas mediante endpoints dedicados multipart.
    Validación formal OpenAPI 3.1 y correspondencia con rutas mediante composer openapi.
    Tickets 1.6d consulta comprobantes históricos coherentes de 80 mm; reimpresión Web autorizada sin nuevas operaciones financieras.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Desarrollo local; los servidores de staging y producción quedan pendientes.
security: []
tags:
  - name: Core
    description: Infraestructura técnica sin acceso a tablas de negocio.
  - name: Auth
    description: Credenciales por username y contraseña; API exclusivamente bearer.
  - name: Catalog
    description: Categorías y productos administrativos; permisos actuales y precios decimales exactos.
  - name: Sales
    description: Mesas, operaciones de venta, checkout financiero e historial autorizado por folio.
  - name: Cash
    description: Caja única, apertura, métodos de pago, movimientos y saldo con efectivo neto confirmado; arqueo ciego, conciliación y cierre transaccional con historial.
  - name: Tickets
    description: Comprobantes históricos y reimpresión Web autorizada de 80 mm.
paths:
  /operations/{idempotencyKey}/status:
    get:
      tags:
      - Core
      operationId: apiV1OperationStatus
      summary: Consulta el estado propio de una intención UUID v4.
      description: 'Autenticación bearer vigente. Contexto derivado del actor; clave
        ajena o desconocida devuelve 404. Sin permisos de consulta de datos financieros
        implícitos: no devuelve el cuerpo almacenado, hash ni contexto interno. Pending
        devuelve metadatos nulos cuando la primera transacción aún no confirmó. Expired
        devuelve solo referencia histórica para reconciliar mediante los endpoints autorizados
        del módulo; nunca vuelve a ejecutar la intención. La consulta no modifica idempotency_records.'
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - in: path
        name: idempotencyKey
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: Estado seguro pending/completed/failed/expired, sin respuesta
            financiera.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cash/payment-methods:
    get:
      tags:
      - Cash
      operationId: apiV1CashPaymentMethods
      summary: Métodos activos con códigos estables; cash.view.
      security:
      - BearerAuth: []
      parameters:
      - &id001
        $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Resultado autorizado; el replay reproduce el mismo recurso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cash/payment-methods/{id}:
    get:
      tags:
      - Cash
      operationId: apiV1CashPaymentMethod
      summary: Detalle de método activo; cash.view. Inactivo devuelve 404.
      security:
      - BearerAuth: []
      parameters:
      - *id001
      - &id002
        name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CatalogUlid'
      responses:
        '200':
          description: Resultado autorizado; el replay reproduce el mismo recurso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cash/movements:
    get:
      tags:
      - Cash
      operationId: apiV1CashMovements
      summary: Historial paginado y saldo de sesión actual; cash.view. Historia de otras sesiones y filtros de otro usuario
        requieren cash.administrative.execute.
      security:
      - BearerAuth: []
      parameters:
      - *id001
      - name: cash_session_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CatalogUlid'
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - cash_in
          - cash_out
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: created_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CatalogUlid'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 10
          - 25
          - 50
          - 100
      responses:
        '200':
          description: Resultado autorizado; el replay reproduce el mismo recurso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashMovementsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
      - Cash
      operationId: apiV1CashMovementRecord
      summary: Entrada/salida manual atómica; cash.view y cash.movements.create. No es cobro de venta.
      security:
      - BearerAuth: []
      parameters:
      - *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      responses:
        '201':
          description: Resultado autorizado; el replay reproduce el mismo recurso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashMovementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: UUID v4 obligatorio por intención; mismo contenido reproduce recurso, datos distintos devuelven IDEMPOTENCY_KEY_CONFLICT
        y ejecución concurrente OPERATION_IN_PROGRESS (409). Reautoriza antes de replay. Sesión explícita debe seguir abierta
        para un movimiento nuevo. Saldo se verifica con bloqueo SQL; salida insuficiente devuelve CONFLICT. Retención de cuerpo
        24 h; tras expiración la clave histórica impide duplicar. La apertura de caja conserva su protocolo existente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - cash_session_id
              - type
              - amount
              - concept
              properties:
                cash_session_id:
                  $ref: '#/components/schemas/CatalogUlid'
                type:
                  type: string
                  enum:
                  - cash_in
                  - cash_out
                amount:
                  type: string
                  pattern: ^(?:0|[1-9][0-9]{0,14})(?:\.[0-9]{1,4})?$
                  not:
                    enum:
                    - '0'
                    - '0.0'
                    - '0.00'
                    - '0.000'
                    - '0.0000'
                concept:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Justificación obligatoria, texto plano normalizado NFC. Sin HTML o controles.
  /cash/movements/{id}:
    get:
      tags:
      - Cash
      operationId: apiV1CashMovement
      summary: Detalle autorizado; sesión actual con cash.view, otras sesiones solo administración financiera.
      security:
      - BearerAuth: []
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: Resultado autorizado; el replay reproduce el mismo recurso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashMovementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cash/registers:
    get:
      tags:
      - Cash
      operationId: apiV1CashRegisters
      summary: Lista la única caja física. Requiere cash.view.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Resultado confirmado; replay devuelve el mismo recurso persistido.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashRegistersResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cash/sessions/current:
    get:
      tags:
      - Cash
      operationId: apiV1CashCurrent
      summary: Consulta la sesión abierta o null. Requiere cash.view.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Resultado confirmado; replay devuelve el mismo recurso persistido.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cash/sessions:
    post:
      tags:
      - Cash
      operationId: apiV1CashOpen
      summary: Abre caja explícitamente. Requiere cash.open y cash.view.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
        description: No reutilizar para otra apertura. Reintentar con la misma clave
          y contenido tras pérdida de respuesta.
      responses:
        '200':
          description: Resultado confirmado; replay devuelve el mismo recurso persistido.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: 'Transacción Core, autorización actual y caja activa. Solo una sesión
        abierta por índice filtrado SQL. Clave durable por actor: mismo fondo/caja recupera
        la sesión original (incluida una sesión ya cerrada), otro contenido devuelve
        409. No se crean pagos ni ingresos. Respuesta 200 tanto inicial como replay.
        Sales 1.5d.2a usa idempotencia durable propia para apertura y modificaciones; Cash conserva su mecanismo de apertura.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashOpen'
  /auth/login:
    post:
      tags: [Auth]
      operationId: apiV1AuthLogin
      summary: Inicia un acceso API con contraseña.
      description: >-
        Requiere HTTPS fuera del entorno local/testing. Credenciales incorrectas,
        inactividad y borrado reciben el mismo error. El token se devuelve una vez.
        Si mustChangePassword es true, solo permite me, logout y password.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 64
                  description: Nombre de usuario; no se autentica por email.
                password:
                  type: string
                  format: password
                  writeOnly: true
                  maxLength: 72
                device_name:
                  type: string
                  maxLength: 64
                  description: Etiqueta del token; no constituye aprobación de Devices.
      responses:
        '200':
          $ref: '#/components/responses/TokenIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [Auth]
      operationId: apiV1AuthMe
      summary: Consulta la identidad del token actual.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Identidad propia, roles y permisos actuales del servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user]
                        properties:
                          user:
                            $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: apiV1AuthLogout
      summary: Revoca exclusivamente el token bearer presentado.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Token revocado; sobre de éxito con data null.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/password:
    post:
      tags: [Auth]
      operationId: apiV1AuthPassword
      summary: Cambia la contraseña propia y renueva el acceso API.
      description: >-
        Requiere contraseña actual y confirmación. Rechaza las tres últimas claves.
        Revoca accesos anteriores y devuelve un nuevo token. No es un reset administrativo.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                  writeOnly: true
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: Ocho caracteres mínimo, máximo 72 bytes y política de 1.3a.
                password_confirmation:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '200':
          $ref: '#/components/responses/TokenIssued'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sessions:
    get:
      tags: [Auth]
      operationId: apiV1AuthSessions
      summary: Consulta accesos propios.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Sobre estándar; data.sessions para listados y data null para revocaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Auth]
      operationId: apiV1AuthRevokeSessions
      summary: Revoca todos los accesos propios; others conserva el actual.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                others:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Sobre estándar; data.sessions para listados y data null para revocaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      operationId: apiV1AuthRevokeSession
      summary: Revoca un acceso propio o ajeno con users.status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
      responses:
        '200':
          description: Sobre estándar; data.sessions para listados y data null para revocaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/users/{userId}/sessions:
    get:
      tags: [Auth]
      operationId: apiV1AuthUserSessions
      summary: Consulta accesos de un usuario con users.status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
      responses:
        '200':
          description: Sobre estándar; data.sessions para listados y data null para revocaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Auth]
      operationId: apiV1AuthRevokeUserSessions
      summary: Revoca todos los accesos de un usuario con users.status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
