  /sales/{id}/receipt:
    get:
      tags:
      - Tickets
      operationId: saleReceiptById
      summary: Consultar comprobante por id
      description: 'Lectura autorizada con sales.view y tickets.view. Conserva el alcance compartido del establecimiento existente.
        Solo venta closed, folio y primer cierre presentes, pagos conciliados y sin corrección activa. La lectura bloqueada
        captura una versión financiera coherente: productos/precios/notas históricos, descuento, pagos originales y adicionales
        confirmados. No emite folios, no modifica dinero, no registra reimpresión y no admite parámetros financieros. No expone
        referencias bancarias, IDs de acceso o costos. Datos del establecimiento opcionales; identificador fiscal solo con configuración
        explícita. No hay datos de clientes registrados en el modelo actual y se omiten. Employee es el nombre disponible de
        la identidad del primer cerrador, no un snapshot histórico de su nombre. La fecha de cierre original se conserva en
        UTC y se convierte para presentación a la zona comercial configurada. Durante una corrección activa devuelve 409; el
        historial financiero anterior sigue en Sales. Reimpresión solo por ruta Web autorizada y auditada, sin confirmar salida
        física.'
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CatalogUlid'
      responses:
        '200':
          description: Comprobante confirmado, sin efectos financieros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReceiptResponse'
        '400':
