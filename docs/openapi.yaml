      summary: Sube o sustituye la imagen principal del producto.
      description: >-
        Requiere catalog.products.view y catalog.products.update, identidad activa,
        contraseña cambiada y acceso vigente. Producto existente no eliminado.
        Solo JPEG, PNG o WebP de contenido real válido, hasta 5242880 bytes.
        Se convierte una sola vez a WebP, máximo 1200 píxeles por lado mayor;
        límites de entrada 8000000 píxeles y 12000 por lado. No admite animaciones.
        No se aceptan disco, ruta ni actor del cliente. La versión y URL cambian en cada sustitución.
        Conserva la imagen anterior ante fallo previo al commit; limpieza posterior recuperable.
