        y producto no eliminado. Sin cuerpo ni rutas de archivo proporcionadas por el cliente.
        La referencia se retira en SQL antes de limpiar el archivo; se conservan referencias
        de otros productos, incluidos los eliminados lógicamente. Idempotente si no hay imagen.
      security: [{BearerAuth: []}]
