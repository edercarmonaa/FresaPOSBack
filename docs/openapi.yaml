    Identity:
      type: object
      additionalProperties: false
      required: [id, name, username, isActive, mustChangePassword, roles, permissions]
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        name:
          type: string
        username:
          type: string
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          description: Capacidades actuales; siempre se verifican además en el servidor.
    TokenData:
      type: object
      additionalProperties: false
      required: [token, token_type, expires_at, user]
      properties:
        token:
          type: string
          readOnly: true
          description: Secreto devuelto una vez tras verificar credenciales. No registrarlo.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
          description: Fecha UTC fija; por defecto ocho horas, configurable.
        user:
          $ref: '#/components/schemas/Identity'
    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      description: Sin espacios ni saltos de línea; la validación del servidor exige coincidencia completa.
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
      additionalProperties: true
    Code:
      type: string
      description: Código estable independiente del mensaje localizado y del estado HTTP.
      enum:
        - OPERATION_SUCCESS
        - BAD_REQUEST
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - TOO_MANY_REQUESTS
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - OPERATION_IN_PROGRESS
        - IDEMPOTENCY_KEY_CONFLICT
        - INVALID_CREDENTIALS
        - SESSION_EXPIRED
        - PIN_INVALID
        - PASSWORD_CHANGE_REQUIRED
    Success:
      type: object
      additionalProperties: false
      required: [success, code, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          const: OPERATION_SUCCESS
        message:
          type: string
          description: Mensaje según el idioma configurado de la aplicación.
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    Error:
      type: object
      additionalProperties: false
      required: [success, code, message, meta]
      properties:
        success:
          type: boolean
          const: false
        code:
          allOf:
            - $ref: '#/components/schemas/Code'
            - not:
                const: OPERATION_SUCCESS
        message:
          type: string
          description: Mensaje público localizado, sin detalles internos incluso con debug activo.
        meta:
          $ref: '#/components/schemas/Meta'
        errors:
          type: object
          minProperties: 1
          description: Solo aparece cuando existen detalles estructurados públicos.
          additionalProperties: true
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [errors]
          properties:
            code:
              const: VALIDATION_ERROR
            errors:
              type: object
              minProperties: 1
              description: Claves de campos, incluidos nombres anidados como items.0.name.
              additionalProperties:
                type: array
                minItems: 1
                items:
                  type: string
  responses:
    TokenIssued:
      description: Acceso emitido. Cache-Control no-store; nunca almacenar el token en logs o URLs.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenData'
    BadRequest:
      description: Solicitud inválida; BAD_REQUEST (400).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Acceso rechazado (401), sin redirección. INVALID_CREDENTIALS en login; UNAUTHENTICATED para bearer ausente o inválido; SESSION_EXPIRED para registro no vigente.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Permiso insuficiente; FORBIDDEN (403).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso o ruta inexistente; NOT_FOUND (404).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Método no admitido; METHOD_NOT_ALLOWED (405).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Allow:
          $ref: '#/components/headers/Allow'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto de aplicación o dominio mapeado; CONFLICT (409).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validación HTTP; VALIDATION_ERROR (422).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Límite excedido; TOO_MANY_REQUESTS (429).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Fallo interno; INTERNAL_ERROR (500). Detalles técnicos solo en el log.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Servicio temporalmente indisponible; SERVICE_UNAVAILABLE (503).
