openapi: 3.1.0
info:
  title: FresaPOSBack API
  version: 1.0.0
  description: >-
    REST v1, autenticación y sesiones de 1.3b/1.3c, catálogo administrativo e imágenes de 1.4c. Ping y login son públicos.
    Sales 1.5b incluye API condicionada a Cash, motivos e idempotencia; aprobación de dispositivos es futura. Imágenes administradas mediante endpoints dedicados multipart.
    Validación formal OpenAPI 3.1 y correspondencia con rutas mediante composer openapi.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Desarrollo local; los servidores de staging y producción quedan pendientes.
security: []
tags:
  - name: Core
    description: Infraestructura técnica sin acceso a tablas de negocio.
  - name: Auth
    description: Credenciales por username y contraseña; API exclusivamente bearer.
  - name: Catalog
    description: Categorías y productos administrativos; permisos actuales y precios decimales exactos.
  - name: Sales
    description: Mesas, consulta y operaciones no financieras sobre ventas; dependencias explícitas.
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: apiV1AuthLogin
      summary: Inicia un acceso API con contraseña.
      description: >-
        Requiere HTTPS fuera del entorno local/testing. Credenciales incorrectas,
        inactividad y borrado reciben el mismo error. El token se devuelve una vez.
        Si mustChangePassword es true, solo permite me, logout y password.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 64
                  description: Nombre de usuario; no se autentica por email.
                password:
                  type: string
                  format: password
                  writeOnly: true
                  maxLength: 72
                device_name:
                  type: string
                  maxLength: 64
                  description: Etiqueta del token; no constituye aprobación de Devices.
      responses:
        '200':
          $ref: '#/components/responses/TokenIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [Auth]
      operationId: apiV1AuthMe
      summary: Consulta la identidad del token actual.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Identidad propia, roles y permisos actuales del servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user]
                        properties:
                          user:
                            $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: apiV1AuthLogout
      summary: Revoca exclusivamente el token bearer presentado.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Token revocado; sobre de éxito con data null.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/password:
    post:
      tags: [Auth]
      operationId: apiV1AuthPassword
      summary: Cambia la contraseña propia y renueva el acceso API.
      description: >-
        Requiere contraseña actual y confirmación. Rechaza las tres últimas claves.
        Revoca accesos anteriores y devuelve un nuevo token. No es un reset administrativo.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                  writeOnly: true
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: Ocho caracteres mínimo, máximo 72 bytes y política de 1.3a.
                password_confirmation:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '200':
          $ref: '#/components/responses/TokenIssued'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sessions:
    get:
      tags: [Auth]
      operationId: apiV1AuthSessions
      summary: Consulta accesos propios.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Sobre estándar; data.sessions para listados y data null para revocaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Auth]
      operationId: apiV1AuthRevokeSessions
      summary: Revoca todos los accesos propios; others conserva el actual.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                others:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Sobre estándar; data.sessions para listados y data null para revocaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      operationId: apiV1AuthRevokeSession
      summary: Revoca un acceso propio o ajeno con users.status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
      responses:
        '200':
          description: Sobre estándar; data.sessions para listados y data null para revocaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/users/{userId}/sessions:
    get:
      tags: [Auth]
      operationId: apiV1AuthUserSessions
      summary: Consulta accesos de un usuario con users.status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
      responses:
        '200':
          description: Sobre estándar; data.sessions para listados y data null para revocaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Auth]
      operationId: apiV1AuthRevokeUserSessions
      summary: Revoca todos los accesos de un usuario con users.status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
      responses:
        '200':
          description: Sobre estándar; data.sessions para listados y data null para revocaciones.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ping:
    get:
      tags: [Core]
      operationId: apiV1CorePing
      summary: Comprueba que la API responde.
      description: No consulta SQL ni sustituye un futuro diagnóstico autenticado.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: API disponible.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [status]
                        properties:
                          status:
                            type: string
                            const: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /catalog/categories:
    get:
      tags: [Catalog]
      operationId: catalogCategoryIndex
      summary: Lista con filtros y paginación SQL
      description: >-
        Requiere catalog.products.view o catalog.categories.manage. Identidad activa, contraseña cambiada y acceso vigente.
        Orden fijo aprobado en 1.4a por display_order, nombre e id ascendentes.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: deleted
          in: query
          description: with y only requieren catalog.categories.manage.
          schema: {type: string, enum: [without, with, only], default: without}
        - name: search
          in: query
          description: Prefijos de hasta ocho palabras; espacios normalizados y collation CI_AI_SC.
          schema: {type: string, maxLength: 100}
        - name: is_active
          in: query
          description: Estado propio del registro.
          schema: {type: boolean}
        - name: sort
          in: query
          description: Solo columnas autorizadas; desempate estable.
          schema: {type: string, enum: [display_order], default: display_order}
        - name: direction
          in: query
          description: Dirección permitida por el contrato de 1.4a.
          schema: {type: string, enum: [asc], default: asc}
        - name: page
          in: query
          description: Página solicitada.
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - name: per_page
          in: query
          description: Registros por página.
          schema: {type: integer, enum: [10, 25, 50, 100], default: 25}
      responses:
        '200':
          description: Operación confirmada; Cache-Control no-store y X-Request-Id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      operationId: catalogCategoryStore
      summary: Crea un registro
      description: >-
        Requiere catalog.categories.manage. Identidad activa, contraseña cambiada y acceso vigente.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Operación confirmada; Cache-Control no-store y X-Request-Id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /catalog/categories/{id}:
    get:
      tags: [Catalog]
      operationId: catalogCategoryShow
      summary: Consulta un registro por ULID
      description: >-
        Requiere catalog.products.view o catalog.categories.manage. Identidad activa, contraseña cambiada y acceso vigente.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CatalogId'
        - name: deleted
          in: query
          description: with y only requieren catalog.categories.manage.
          schema: {type: string, enum: [without, with, only], default: without}
      responses:
        '200':
          description: Operación confirmada; Cache-Control no-store y X-Request-Id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Catalog]
      operationId: catalogCategoryUpdate
      summary: Edita un registro
      description: >-
        Requiere catalog.categories.manage. Identidad activa, contraseña cambiada y acceso vigente.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CatalogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Operación confirmada; Cache-Control no-store y X-Request-Id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Catalog]
      operationId: catalogCategoryDestroy
      summary: Elimina lógicamente sin borrar referencias
      description: >-
        Requiere catalog.categories.manage. Identidad activa, contraseña cambiada y acceso vigente.
        No existe operación de restauración de categorías. Nombres eliminados siguen reservados.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CatalogId'
      responses:
        '200':
          description: Operación confirmada; Cache-Control no-store y X-Request-Id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDeleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /catalog/categories/{id}/status:
    patch:
      tags: [Catalog]
      operationId: catalogCategoryStatus
      summary: Activa o desactiva
      description: >-
        Requiere catalog.categories.manage. Identidad activa, contraseña cambiada y acceso vigente.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CatalogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogStatus'
      responses:
        '200':
          description: Operación confirmada; Cache-Control no-store y X-Request-Id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /catalog/products:
    get:
      tags: [Catalog]
      operationId: catalogProductIndex
      summary: Lista con filtros y paginación SQL
      description: >-
        Requiere catalog.products.view. Identidad activa, contraseña cambiada y acceso vigente.
        Consulta administrativa; is_active filtra el estado propio del producto, no su vendibilidad.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: deleted
          in: query
          description: with y only requieren catalog.products.restore además de lectura.
          schema: {type: string, enum: [without, with, only], default: without}
        - name: search
          in: query
          description: Prefijos de hasta ocho palabras; espacios normalizados y collation CI_AI_SC.
          schema: {type: string, maxLength: 100}
        - name: is_active
          in: query
          description: Estado propio del registro.
          schema: {type: boolean}
        - name: category_id
          in: query
          description: Filtra por categoría.
          schema: {$ref: '#/components/schemas/CatalogUlid'}
        - name: sort
          in: query
          description: Solo columnas autorizadas; desempate estable.
          schema: {type: string, enum: [name, price], default: name}
        - name: direction
          in: query
          description: Dirección permitida por el contrato de 1.4a.
          schema: {type: string, enum: [asc, desc], default: asc}
        - name: page
          in: query
          description: Página solicitada.
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - name: per_page
          in: query
          description: Registros por página.
          schema: {type: integer, enum: [10, 25, 50, 100], default: 25}
      responses:
        '200':
          description: Operación confirmada; Cache-Control no-store y X-Request-Id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      operationId: catalogProductStore
      summary: Crea un registro
      description: >-
        Requiere catalog.products.view y catalog.products.create. Identidad activa, contraseña cambiada y acceso vigente.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Operación confirmada; Cache-Control no-store y X-Request-Id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /catalog/products/{id}:
    get:
      tags: [Catalog]
      operationId: catalogProductShow
      summary: Consulta un registro por ULID
      description: >-
        Requiere catalog.products.view. Identidad activa, contraseña cambiada y acceso vigente.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CatalogId'
        - name: deleted
          in: query
          description: with y only requieren catalog.products.restore además de lectura.
