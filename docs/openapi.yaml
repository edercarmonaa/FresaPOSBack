    post:
      tags: [Catalog]
      operationId: catalogProductImageStore
      summary: Sube o sustituye la imagen principal del producto.
      description: >-
        Requiere catalog.products.view y catalog.products.update, identidad activa,
        contraseña cambiada y acceso vigente. Producto existente no eliminado.
        Solo JPEG, PNG o WebP de contenido real válido, hasta 5242880 bytes.
        Se convierte una sola vez a WebP, máximo 1200 píxeles por lado mayor;
        límites de entrada 8000000 píxeles y 12000 por lado. No admite animaciones.
        No se aceptan disco, ruta ni actor del cliente. La versión y URL cambian en cada sustitución.
        Conserva la imagen anterior ante fallo previo al commit; limpieza posterior recuperable.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CatalogId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Archivo original de hasta 5 MiB; se valida MIME real y decodificación, no solo el nombre.
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Producto con image.url pública y nueva image.version; no-store y X-Request-Id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Catalog]
      operationId: catalogProductImageDestroy
      summary: Retira la imagen principal sin eliminar el producto.
      description: >-
