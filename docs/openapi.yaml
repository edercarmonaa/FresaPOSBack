        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Laravel Sanctum implementado en 1.3b. Token opaco, sin JWT; SHA-256 en SQL,
        con expiración y revocación. Nunca en URLs. Las cookies Web no autentican esta API.
  parameters:
    CatalogId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CatalogUlid'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Identificador opcional del cliente. Un valor inválido se descarta y se
        sustituye por un ULID nativo. No autentica ni proporciona idempotencia.
      schema:
        $ref: '#/components/schemas/RequestId'
  headers:
    RequestId:
      description: Siempre presente en respuestas de API; coincide con meta.request_id.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    RetryAfter:
      description: Segundos hasta un nuevo intento; se conserva en 429 y si el 503 lo proporciona.
      schema:
        type: string
    Allow:
      description: Métodos HTTP admitidos por la ruta.
      schema:
        type: string
  schemas:
    CatalogUlid:
      type: string
      pattern: '^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$'
      description: ULID nativo serializado como texto de 26 caracteres.
      example: 01arz3ndektsv4rrffq69g5fav
    CatalogPrice:
      type: string
      pattern: '^[0-9]{1,15}(\.[0-9]{1,4})?$'
      description: Decimal exacto no negativo; salida canónica con cuatro decimales. Sin miles ni exponentes.
      example: '25.5000'
    CatalogStatus:
      type: object
      additionalProperties: false
      required: [is_active]
      properties:
        is_active:
          type: boolean
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, maxLength: 150, description: 'Normalizado, único incluso entre eliminados; comparación CI_AI_SC.'}
        description: {type: [string, 'null'], maxLength: 1000}
        is_active: {type: boolean, default: true}
        display_order: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
    ProductInput:
      type: object
      additionalProperties: false
      required: [name, category_id, price]
      description: >-
        POST y PUT exigen nombre, categoría y precio; campos opcionales omitidos en PUT se conservan.
        La categoría debe existir y estar disponible para nuevas asignaciones.
        image, image_disk e image_key no se aceptan en 1.4b.
      properties:
        name: {type: string, maxLength: 150}
        description: {type: [string, 'null'], maxLength: 2000}
        category_id: {$ref: '#/components/schemas/CatalogUlid'}
        price:
          oneOf:
            - $ref: '#/components/schemas/CatalogPrice'
            - {type: integer, minimum: 0, maximum: 999999999999999}
          description: Se recomienda texto decimal; números JSON fraccionarios se rechazan para evitar floats.
        is_active: {type: boolean, description: 'En edición requiere también permiso de cambio de estado.'}
    Category:
      type: object
      additionalProperties: false
      required: [id, name, description, is_active, display_order, created_at, updated_at, deleted_at]
      properties:
        id: {$ref: '#/components/schemas/CatalogUlid'}
        name: {type: string}
        description: {type: [string, 'null']}
        is_active: {type: boolean}
        display_order: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
    Product:
      type: object
      additionalProperties: false
      required: [id, name, description, category_id, category, price, is_active, image, created_at, updated_at, deleted_at]
      properties:
        id: {$ref: '#/components/schemas/CatalogUlid'}
        name: {type: string}
        description: {type: [string, 'null']}
        category_id: {$ref: '#/components/schemas/CatalogUlid'}
        category:
          type: object
          required: [id, name]
          properties:
            id: {$ref: '#/components/schemas/CatalogUlid'}
            name: {type: string}
        price: {$ref: '#/components/schemas/CatalogPrice'}
        is_active: {type: boolean}
        image:
          type: [object, 'null']
          additionalProperties: false
          required: [url, version]
          description: Solo URL pública y versión inmutable; sin discos ni rutas de servidor. Sin subida de imágenes.
          properties:
            url: {type: string, format: uri-reference}
            version: {$ref: '#/components/schemas/CatalogUlid'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
    CatalogPagination:
      type: object
      required: [current_page, per_page, total, last_page, from, to]
      properties:
        current_page: {type: integer, minimum: 1}
        per_page: {type: integer, enum: [10, 25, 50, 100]}
        total: {type: integer, minimum: 0}
        last_page: {type: integer, minimum: 1}
        from: {type: [integer, 'null']}
        to: {type: [integer, 'null']}
    CatalogDeleted:
      allOf:
        - $ref: '#/components/schemas/Success'
        - properties:
            data: {type: 'null'}
    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - properties:
            data: {$ref: '#/components/schemas/Category'}
    CategoryPage:
      examples:
        - success: true
          code: OPERATION_SUCCESS
          message: Operación completada correctamente.
          data: {categories: []}
          meta:
            request_id: catalog-example
            pagination: {current_page: 1, per_page: 25, total: 0, last_page: 1, from: null, to: null}
      allOf:
        - $ref: '#/components/schemas/Success'
        - properties:
            data:
              type: object
              required: [categories]
              properties:
                categories:
                  type: array
                  items: {$ref: '#/components/schemas/Category'}
            meta:
              allOf:
                - $ref: '#/components/schemas/Meta'
                - required: [pagination]
                  properties:
                    pagination: {$ref: '#/components/schemas/CatalogPagination'}

    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - properties:
            data: {$ref: '#/components/schemas/Product'}
    ProductPage:
      examples:
        - success: true
          code: OPERATION_SUCCESS
          message: Operación completada correctamente.
          data: {products: []}
          meta:
            request_id: catalog-example
            pagination: {current_page: 1, per_page: 25, total: 0, last_page: 1, from: null, to: null}
      allOf:
        - $ref: '#/components/schemas/Success'
        - properties:
            data:
              type: object
              required: [products]
              properties:
                products:
                  type: array
                  items: {$ref: '#/components/schemas/Product'}
            meta:
              allOf:
                - $ref: '#/components/schemas/Meta'
                - required: [pagination]
                  properties:
                    pagination: {$ref: '#/components/schemas/CatalogPagination'}

    Identity:
      type: object
      additionalProperties: false
      required: [id, name, username, isActive, mustChangePassword, roles, permissions]
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        name:
          type: string
        username:
          type: string
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          description: Capacidades actuales; siempre se verifican además en el servidor.
    TokenData:
      type: object
      additionalProperties: false
      required: [token, token_type, expires_at, user]
      properties:
        token:
          type: string
          readOnly: true
          description: Secreto devuelto una vez tras verificar credenciales. No registrarlo.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
          description: Fecha UTC fija; por defecto ocho horas, configurable.
        user:
          $ref: '#/components/schemas/Identity'
    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      description: Sin espacios ni saltos de línea; la validación del servidor exige coincidencia completa.
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
      additionalProperties: true
    Code:
      type: string
      description: Código estable independiente del mensaje localizado y del estado HTTP.
      enum:
        - OPERATION_SUCCESS
        - BAD_REQUEST
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - TOO_MANY_REQUESTS
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - INVALID_CREDENTIALS
        - SESSION_EXPIRED
        - PIN_INVALID
        - PASSWORD_CHANGE_REQUIRED
    Success:
      type: object
      additionalProperties: false
      required: [success, code, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          const: OPERATION_SUCCESS
        message:
          type: string
          description: Mensaje según el idioma configurado de la aplicación.
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    Error:
      type: object
      additionalProperties: false
      required: [success, code, message, meta]
      properties:
        success:
          type: boolean
          const: false
        code:
          allOf:
            - $ref: '#/components/schemas/Code'
            - not:
                const: OPERATION_SUCCESS
        message:
          type: string
          description: Mensaje público localizado, sin detalles internos incluso con debug activo.
        meta:
          $ref: '#/components/schemas/Meta'
        errors:
          type: object
          minProperties: 1
          description: Solo aparece cuando existen detalles estructurados públicos.
          additionalProperties: true
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [errors]
          properties:
            code:
              const: VALIDATION_ERROR
            errors:
              type: object
              minProperties: 1
              description: Claves de campos, incluidos nombres anidados como items.0.name.
              additionalProperties:
                type: array
                minItems: 1
                items:
                  type: string
  responses:
    TokenIssued:
      description: Acceso emitido. Cache-Control no-store; nunca almacenar el token en logs o URLs.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenData'
    BadRequest:
      description: Solicitud inválida; BAD_REQUEST (400).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Acceso rechazado (401), sin redirección. INVALID_CREDENTIALS en login; UNAUTHENTICATED para bearer ausente o inválido; SESSION_EXPIRED para registro no vigente.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Permiso insuficiente; FORBIDDEN (403).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso o ruta inexistente; NOT_FOUND (404).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Método no admitido; METHOD_NOT_ALLOWED (405).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Allow:
          $ref: '#/components/headers/Allow'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto de aplicación o dominio mapeado; CONFLICT (409).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validación HTTP; VALIDATION_ERROR (422).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Límite excedido; TOO_MANY_REQUESTS (429).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Fallo interno; INTERNAL_ERROR (500). Detalles técnicos solo en el log.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Servicio temporalmente indisponible; SERVICE_UNAVAILABLE (503).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

