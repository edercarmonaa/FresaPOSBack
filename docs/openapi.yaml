components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Laravel Sanctum implementado en 1.3b. Token opaco, sin JWT; SHA-256 en SQL,
        con expiración y revocación. Nunca en URLs. Las cookies Web no autentican esta API.
  parameters:
    CatalogId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CatalogUlid'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Identificador opcional del cliente. Un valor inválido se descarta y se
        sustituye por un ULID nativo. No autentica ni proporciona idempotencia.
      schema:
        $ref: '#/components/schemas/RequestId'
  headers:
    RequestId:
      description: Siempre presente en respuestas de API; coincide con meta.request_id.
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
    RetryAfter:
      description: Segundos hasta un nuevo intento; se conserva en 429 y si el 503 lo proporciona.
      schema:
        type: string
    Allow:
      description: Métodos HTTP admitidos por la ruta.
      schema:
        type: string
  schemas:
    SalesRevision:
      type: string
      pattern: ^[a-f0-9]{64}$
      description: Token opaco del estado leído. Enviar entre comillas en If-Match; no es rowversion.
    SalesMoney:
      type: string
      pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
    SalesTable:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - is_active
      - display_order
      - availability
      - active_sale_id
      - revision
      properties:
        id:
          $ref: '#/components/schemas/CatalogUlid'
        name:
          type: string
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
        availability:
          type: string
          enum:
          - free
          - occupied
          - inactive
        active_sale_id:
          anyOf:
          - $ref: '#/components/schemas/CatalogUlid'
          - type: 'null'
        revision:
          $ref: '#/components/schemas/SalesRevision'
    SalesItem:
      type: object
      additionalProperties: false
      required:
      - id
      - product_id
      - name
      - category
      - unit_price
      - quantity
      - note
      - line_total
      - position
      - removed_at
      properties:
        id:
          $ref: '#/components/schemas/CatalogUlid'
        product_id:
          $ref: '#/components/schemas/CatalogUlid'
        name:
          type: string
        category:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          properties:
            id:
              $ref: '#/components/schemas/CatalogUlid'
            name:
              type: string
        unit_price:
          $ref: '#/components/schemas/SalesMoney'
        quantity:
          type: integer
          minimum: 1
        note:
          type:
          - string
          - 'null'
          maxLength: 100
        line_total:
          $ref: '#/components/schemas/SalesMoney'
        position:
          type: integer
          minimum: 1
        removed_at:
          type:
          - string
          - 'null'
          format: date-time
    SalesTableCreate:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 150
        display_order:
          type: integer
          minimum: 0
          maximum: 2147483647
    SalesTableUpdate:
      type: object
      additionalProperties: false
      required:
      - name
      - is_active
      properties:
        name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 0
          maximum: 2147483647
    SalesOpen:
      type: object
      additionalProperties: false
      required:
      - type
      allOf:
        - if:
            properties:
              type: {const: table}
          then:
            required: [table_id]
        - if:
            properties:
              type: {const: counter}
          then:
            not:
              required: [table_id]
      properties:
        type:
          type: string
          enum:
          - counter
          - table
        table_id:
          $ref: '#/components/schemas/CatalogUlid'
        note:
          type:
          - string
          - 'null'
          maxLength: 150
    SalesAddItem:
      type: object
      additionalProperties: false
      required:
      - product_id
      - quantity
      properties:
        product_id:
          $ref: '#/components/schemas/CatalogUlid'
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        note:
          type:
          - string
          - 'null'
          maxLength: 100
    SalesQuantity:
      type: object
      additionalProperties: false
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    SalesNote:
      type: object
      additionalProperties: false
      required:
      - note
      properties:
        note:
          type:
          - string
          - 'null'
          maxLength: 150
    SalesItemNote:
      type: object
      additionalProperties: false
      required:
      - note
      properties:
        note:
          type:
          - string
          - 'null'
          maxLength: 100
    SalesReason:
      type: object
      additionalProperties: false
      required:
      - reason_code
      properties:
        reason_code:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_:-]{0,63}$
    SalesSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - state
      - table_id
      - created_by
      - note
      - subtotal
      - discount
      - total
      - created_at
      - updated_at
      - closed_at
      - cancelled_at
      properties:
        id:
          $ref: '#/components/schemas/CatalogUlid'
        type:
          type: string
          enum:
          - counter
          - table
        state:
          type: string
          enum:
          - open
          - paused
          - closed
          - cancelled
          - reopened
        table_id:
          anyOf:
          - $ref: '#/components/schemas/CatalogUlid'
          - type: 'null'
        created_by:
          $ref: '#/components/schemas/CatalogUlid'
        note:
          type:
          - string
          - 'null'
          maxLength: 150
        subtotal:
          $ref: '#/components/schemas/SalesMoney'
        discount:
          $ref: '#/components/schemas/SalesMoney'
        total:
          $ref: '#/components/schemas/SalesMoney'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
    SalesDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - state
      - table_id
      - created_by
      - note
      - subtotal
      - discount
      - total
      - created_at
      - updated_at
      - closed_at
      - cancelled_at
      - revision
      - items
      properties:
        id:
          $ref: '#/components/schemas/CatalogUlid'
        type:
          type: string
          enum:
          - counter
          - table
        state:
          type: string
          enum:
          - open
          - paused
          - closed
          - cancelled
          - reopened
        table_id:
          anyOf:
          - $ref: '#/components/schemas/CatalogUlid'
          - type: 'null'
        created_by:
          $ref: '#/components/schemas/CatalogUlid'
        note:
          type:
